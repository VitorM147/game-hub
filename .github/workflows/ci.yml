name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build:game
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Primeiro o build de servidor (é ele que os testes de navegador usam)...
      - run: npm run build
      - name: Testes de navegador (e2e)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      # ...e por último o build estático do GitHub Pages (com base path), numa pasta limpa.
      - name: Build estático (como no GitHub Pages)
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          rm -rf .next out
          npm run build
          test -f out/index.html
