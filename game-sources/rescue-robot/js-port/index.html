<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ORION — Protocolo RX-7</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 8 8%27%3E%3Crect width=%278%27 height=%278%27 fill=%27%230b0d12%27/%3E%3Crect x=%271%27 y=%272%27 width=%276%27 height=%274%27 fill=%27%239be15d%27/%3E%3C/svg%3E">
<style>
  :root { --s: clamp(88px, 30vmin, 150px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #080c1c; overflow: hidden; overscroll-behavior: none; }
  body { font-family: "Liberation Sans", Arial, sans-serif; user-select: none; -webkit-user-select: none; }
  #app { position: relative; display: flex; flex-direction: column; height: 100%; }
  #stage { flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: #080c1c; touch-action: none; outline: none; }
  #touch { display: none; }
  body.touch #touch {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
    position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  body.touch #touch > * { pointer-events: auto; touch-action: none; }
  #pad {
    position: relative; width: var(--s); height: var(--s); border-radius: 50%;
    background: rgba(8, 12, 28, .55); border: 2px solid rgba(95, 235, 255, .55);
  }
  #pad::before, #pad::after { content: ""; position: absolute; background: rgba(95, 235, 255, .25); }
  #pad::before { left: 50%; top: 10%; bottom: 10%; width: 2px; transform: translateX(-1px); }
  #pad::after { top: 50%; left: 10%; right: 10%; height: 2px; transform: translateY(-1px); }
  #knob { position: absolute; left: 50%; top: 50%; width: 38%; height: 38%; margin: -19% 0 0 -19%; border-radius: 50%;
    background: rgba(95, 235, 255, .55); border: 2px solid #5febff; transition: transform 60ms linear; }
  #btns { display: grid; grid-template-columns: repeat(2, auto); gap: 8px; }
  #btns button {
    min-width: calc(var(--s) * .56); height: calc(var(--s) * .4); padding: 0 10px; border-radius: 4px;
    font: bold 13px/1 "Liberation Sans", Arial, sans-serif; letter-spacing: .04em; color: #eff6ff;
    background: rgba(8, 12, 28, .6); border: 2px solid rgba(95, 235, 255, .55);
  }
  #btns button[data-key="Enter"] { grid-column: 1 / -1; background: rgba(94, 239, 150, .25); border-color: #5eef96; color: #5eef96; height: calc(var(--s) * .46); }
  #btns button.on { background: rgba(95, 235, 255, .45); }
  @media (orientation: portrait) {
    body.touch #touch { position: static; padding-top: 14px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="canvas" width="960" height="640" tabindex="0" aria-label="ORION — Protocolo RX-7: área do jogo"></canvas></div>
  <div id="touch">
    <div id="pad" aria-label="Alavanca de movimento"><i id="knob"></i></div>
    <div id="btns">
      <button type="button" data-key="Enter">ENTER</button>
      <button type="button" data-key="p">PAUSA</button>
      <button type="button" data-key="r">REINICIAR</button>
      <button type="button" data-key="m">SOM</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
